<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/about/' | relative_url }}">About</a></nav>
</div></header>
<main class="wrap">
{{ content }}
</main>
<footer><div class="wrap">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. <a href="{{ '/feed.xml' | relative_url }}">RSS</a></div></footer>
</body>
</html>
